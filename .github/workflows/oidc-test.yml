name: oidc-test #trigger test #2


on:
  pull_request:
    paths:
      - ".github/workflows/oidc-test.yml"

permissions:
  id-token: write
  contents: read

jobs:
  whoami:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/gha-tf-plan
          aws-region: us-east-2
      - run: aws sts get-caller-identity

name: terraform-apply

on:
  push:
    branches: [main]
    paths:
      - "envs/dev/**"
      - "modules/**"
      - ".github/workflows/terraform-apply.yml"
  workflow_dispatch:

concurrency:
  group: terraform-apply-dev
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apply-dev:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: dev
    permissions:
      id-token: write
      contents: read
    env:
      TF_DIR: envs/dev/us-east-2
      TF_VAR_aws_account_id: ${{ vars.AWS_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: mask account id
        env:
          ACCT: ${{ vars.AWS_ACCOUNT_ID }}
        run: echo "::add-mask::$ACCT"
      - id: tfv
        run: echo "v=$(cat .terraform-version)" >> "$GITHUB_OUTPUT"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.tfv.outputs.v }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/gha-tf-apply-dev
          aws-region: us-east-2
      - name: init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -input=false
      - name: plan
        id: plan
        working-directory: ${{ env.TF_DIR }}
        run: |
          set +e
          terraform plan -input=false -lock-timeout=300s -no-color -detailed-exitcode -var-file=dev.tfvars -out=tfplan
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 1 ]; then exit 1; fi
      - name: apply the saved plan
        if: steps.plan.outputs.code == '2'
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -input=false -lock-timeout=300s -no-color tfplan
      - name: nothing to apply
        if: steps.plan.outputs.code == '0'
        run: echo "No changes. Infrastructure already matches main."

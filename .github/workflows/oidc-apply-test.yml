name: oidc-apply-test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  whoami-dev:
    runs-on: ubuntu-24.04
    environment: dev
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/gha-tf-apply-dev
          aws-region: us-east-2
      - run: aws sts get-caller-identity
